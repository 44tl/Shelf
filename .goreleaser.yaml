version: 2

project_name: shelf

before:
  hooks:
    - go mod tidy

builds:
  - id: shelf
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

nfpms:
  - formats:
      - deb
      - rpm
      - archlinux
    vendor: shelf
    homepage: https://github.com/44tl/Shelf
    maintainer: Eskrid <44tl@users.noreply.github.com>
    description: Give every download a home — preview-first folder organizer with real undo.
    license: MIT

brews:
  - repository:
      owner: 44tl
      name: homebrew-tap
    directory: Formula
    homepage: https://github.com/44tl/Shelf
    description: Give every download a home — preview-first folder organizer with real undo.
    license: MIT
    token: "{{ .Env.TAP_GITHUB_TOKEN }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore"
      - "^test"
