name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go vet ./...
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          go test -v ./... 2>&1 | tee test-output.log
          if grep -E -- '(--- FAIL|panic )' test-output.log; then
            grep -E -- '(--- FAIL|panic )' test-output.log | while IFS= read -r line; do
              echo "::error file=test-output.log::$line"
            done
            exit 1
          fi
      - run: go build ./...
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-log-${{ matrix.os }}
          path: test-output.log
